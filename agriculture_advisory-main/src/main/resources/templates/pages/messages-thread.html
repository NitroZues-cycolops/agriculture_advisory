<!DOCTYPE html>
<!--
  =====================================================================
  PURPOSE : PART 3 - one private conversation at /messages/{id}.
  ROUTE   : GET  /messages/{id}   -> CommunityController.thread
            POST /messages/{id}   -> CommunityController.send
  ROLE    : a farmer the viewer FOLLOWS or who FOLLOWS the viewer (else the
            friendly /messages/{id} blocked page). Only the two people chat.
  LAYOUT  : layout-home -> the message list and a send form.
  DATA    : other, thread, me, following, errors, form, withPhoto
  NO JAVASCRIPT : a normal POST form; the "Refresh" link re-requests this page to
            show new messages (there is no live update).
  ORDER   : oldest at the top, newest at the bottom; my own messages are aligned
            to the right, with an avatar beside EVERY message.
  If this breaks, check:
    - "no messages yet" -> write the first one (the form is always shown).
    - a missing key on screen -> messages.* keys in all four message files.
  =====================================================================
-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: main(~{::content}, 'layout-home', 6)}">
<body>

<th:block th:fragment="content">

    <!-- TILE START: messages-thread | controller: CommunityController.thread | full-width -->
    <div class="tile tile--span" id="tile-messages-thread">
        <div class="tile__header">
            <span class="tile__title"
                  th:text="'[6] ' + #{messages.thread.title(${other.displayName()})}">[6] Conversation</span>
        </div>
        <div class="tile__body">

            <p style="margin-bottom:12px;">
                <a class="card__btn" th:href="@{/messages}" th:text="#{messages.title}">Messages</a>
                <a class="card__btn" th:href="@{/community/profile/{id}(id=${other.userId})}"
                   th:text="#{community.profile.title}">Farm profile</a>
                <!-- No JavaScript, so a visible Refresh link re-requests the page. -->
                <a class="card__btn" th:href="@{/messages/{id}(id=${other.userId})}"
                   th:text="#{messages.thread.refresh}">Refresh</a>
            </p>

            <p class="card__text" th:if="${#lists.isEmpty(thread)}"
               th:text="#{messages.thread.empty}">No messages yet - write the first one.</p>

            <div class="chat">
                <div class="chat__row" th:each="msg : ${thread}"
                     th:classappend="${msg.senderId == me} ? ' chat__row--mine'">
                    <span th:replace="~{fragments/avatar :: avatar(${msg.senderId}, ${msg.senderId == me ? #authentication.name : other.displayName()}, ${withPhoto.contains(msg.senderId)})}"></span>
                    <div class="chat__bubble">
                        <div class="chat__meta">
                            <span th:if="${msg.senderId == me}" th:text="#{messages.thread.you}">You</span>
                            <span th:if="${msg.senderId != me}" th:text="${other.displayName()}">Farmer</span>
                            <span th:text="${#temporals.format(msg.createdAt, 'dd MMM yyyy, HH:mm')}">18 Oct 2026</span>
                            <!-- Only the SENDER may delete their own message, and
                                 only while it still has text (a deleted one is blank). -->
                            <a class="btn btn--danger"
                               th:if="${msg.senderId == me and !#strings.isEmpty(msg.content)}"
                               th:href="@{/community/message/{id}/delete(id=${msg.id})}"
                               th:text="#{community.delete}">Delete</a>
                        </div>
                        <!-- A soft-deleted message has blank text: show the placeholder
                             so BOTH people still see that a message once existed here. -->
                        <p class="card__text" th:if="${#strings.isEmpty(msg.content)}"
                           th:text="#{community.message.deleted}">This message was deleted.</p>
                        <p class="card__text" th:unless="${#strings.isEmpty(msg.content)}"
                           th:text="${msg.content}">message</p>
                    </div>
                </div>
            </div>

            <form th:action="@{/messages/{id}(id=${other.userId})}" method="post"
                  style="margin-top:14px;">
                <div class="form-row">
                    <label for="content" th:text="#{messages.thread.type}">Your message</label>
                    <textarea id="content" name="content" maxlength="1000" required
                              th:classappend="${errors['content'] != null} ? ' is-invalid'"
                              th:text="${form['content']}"></textarea>
                    <span class="form-error" th:if="${errors['content'] != null}"
                          th:text="${errors['content']}">error</span>
                </div>
                <button class="btn btn--primary" type="submit"
                        th:text="#{messages.thread.send}">Send</button>
            </form>
        </div>
    </div>
    <!-- TILE END: messages-thread -->

</th:block>

</body>
</html>
