# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/advisory_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=advisory
spring.datasource.password=advisory123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Initialize DB with schema and data
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:sample_data.sql

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# Internationalization
# basename=messages loads messages.properties (base) plus messages_en/_hi/_mr.properties
spring.messages.basename=messages
spring.messages.encoding=UTF-8
# false -> if a locale file is missing, fall back to the base file, NOT the OS locale.
# Without this, a system locale like en_US can make lookups render as ??key_en_US??.
spring.messages.fallback-to-system-locale=false

# Logging
logging.level.com.precisionfarming.advisory_service=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Security
spring.security.user.name=admin
spring.security.user.password=admin

# ---------------------------------------------------------------------
# STEP 4 - WEATHER SCRAPER (properties ADDED, the datasource above is
# unchanged). Read by GreenAlertsScraper, OpenMeteoSource and WeatherService.
# ---------------------------------------------------------------------
# A real User-Agent, so greenalerts.in sees a named visitor instead of a bot.
# CHANGE THIS to your own name/e-mail before any real use.
pfas.weather.user-agent=PrecisionFarmingAdvisory/0.1 (college mini project)
# Hard limit for one HTTP request (connect + read), in milliseconds.
pfas.weather.timeout-ms=15000
# Polite pause between two requests of the scheduled job, in milliseconds.
pfas.weather.delay-ms=2500

# ---------------------------------------------------------------------
# PART A - DAILY REFRESH (properties ADDED only; the datasource above is
# unchanged and spring.sql.init.mode stays "never").
# ---------------------------------------------------------------------
# The weather refresh runs ONCE A DAY, at 06:00 India time. Read by
# WeatherService via @Scheduled(cron = "${weather.refresh.cron}", zone = "Asia/Kolkata").
# Standard Spring 6-field cron: second minute hour day month weekday.
# To run it every 6 hours instead, use "0 0 */6 * * *" (no code change needed).
weather.refresh.cron=0 0 6 * * *
# Spring's @Scheduled zone is fixed in code to Asia/Kolkata (see WeatherService).
# History RETENTION: readings and forecast rows older than this many days are
# deleted after every refresh, so weather_cache cannot grow without bound.
weather.history.days=30
# A district is "stale" when its newest cached reading is older than this many
# hours; the start-up catch-up task then refreshes in the background.
weather.catchup.hours=24

# ---------------------------------------------------------------------
# PART 1 - EMAIL VERIFICATION (properties ADDED only; the datasource above
# is unchanged and spring.sql.init.mode stays "never").
# ---------------------------------------------------------------------
# The one-time handle in the /verify/email?h=... link stays valid for this
# many hours.
verification.handle.hours=24
# The email verification link token stays valid for this many hours.
email.token.hours=24
# Rate limit for a NEW email link: at most once per minute and 5 per hour,
# per account (counters are stored in the email_verification table).
email.resend.seconds=60
email.resend.per.hour=5
# Sender address used for the verification email (only read when mail is set up).
pfas.mail.from=no-reply@precisionfarming.local
# Public base URL used to build the /verify/email/confirm link. Leave blank
# (the default) to derive it from the incoming request; set it when the app is
# reached through a proxy so the link in the email points at the right host.
app.base-url=
# To send REAL emails instead of demo mode, set your SMTP settings here, e.g.:
#   spring.mail.host=smtp.example.com
#   spring.mail.port=587
#   spring.mail.username=you@example.com
#   spring.mail.password=your-app-password
#   spring.mail.properties.mail.smtp.auth=true
#   spring.mail.properties.mail.smtp.starttls.enable=true
# With no spring.mail.host the app logs the link and shows it on the page.

# ---------------------------------------------------------------------
# PART 4 - EMAIL ROBUSTNESS (properties ADDED only; the datasource above is
# unchanged and spring.sql.init.mode stays "never").
# ---------------------------------------------------------------------
# Hard timeouts (milliseconds) for the SMTP conversation. Without them a dead
# or slow mail server can make the request hang for minutes. The send runs
# OUTSIDE the rate-limit transaction, so a slow SMTP server never holds a
# database lock and never blocks other users.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ---------------------------------------------------------------------
# PART 2a - PROFILE PICTURE UPLOAD (properties ADDED only; the datasource
# above is unchanged and spring.sql.init.mode stays "never").
# ---------------------------------------------------------------------
# The REAL 2 MB limit is enforced in code (ProfilePhotoService.store, and the
# community photo upload), which answers a too-large file with a friendly
# per-field message instead of an error page. The servlet container's own cap
# must therefore sit ABOVE 2 MB - otherwise the container rejects the request
# BEFORE it reaches the controller and that friendly message is never shown
# (Spring Boot's 1 MB default would break the 2 MB rule with a 500).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
