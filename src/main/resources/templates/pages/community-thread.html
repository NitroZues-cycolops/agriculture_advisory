<!DOCTYPE html>
<!--
  =====================================================================
  PURPOSE : One private conversation (workspace 6) - STEP 6.
  ROUTE   : GET  /community/messages/{id}   -> CommunityController.thread
            POST /community/messages/{id}   -> CommunityController.send
  ROLE    : any authenticated user (only the two people in the thread)
  LAYOUT  : layout-home -> the message list and a send form.
    DATA    : other, thread, me, role, unread, canMessage, messageErrors, messageValue
  NO JAVASCRIPT : a normal POST form; refreshing the page shows new messages.
  If this breaks, check:
    - Messages not delivered -> direct_messages rows (sender_id, receiver_id).
    - Text as a missing key -> community.* keys in all four message files.
  =====================================================================
-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: main(~{::content}, 'layout-home', 6)}">
<body>

<th:block th:fragment="content">

    <!-- TILE START: commthread-body | controller: CommunityController.thread | full-width -->
    <div class="tile tile--span" id="tile-commthread-body">
        <div class="tile__header">
            <span class="tile__title"
                  th:text="'[6] ' + #{community.thread.title(${other.displayName()})}">[6] Conversation</span>
        </div>
        <div class="tile__body">

            <p style="margin-bottom:12px;">
                <a class="card__btn" th:href="@{/messages}" th:text="#{community.inbox}">Inbox</a>
                <a class="card__btn" th:href="@{/community/profile/{id}(id=${other.userId})}"
                   th:text="#{community.profile.title}">Farm profile</a>
                <a class="card__btn" th:href="@{/messages/{id}(id=${other.userId})}"
                   th:text="#{community.thread.refresh}">Refresh</a>
            </p>

            <div class="farmer-card__heading">
                <img class="avatar avatar--large" th:src="@{/avatar/{id}(id=${other.userId})}"
                     th:alt="#{community.avatar.alt(${other.displayName()})}">
                <h1 class="page-head__title" th:text="${other.displayName()}">Farmer</h1>
            </div>

            <div class="alert alert--warning" th:unless="${canMessage}">
                <p th:text="#{community.thread.no_access}">Follow this farmer to start a conversation.</p>
                <form th:if="${!following}" th:action="@{/community/follow/{id}(id=${other.userId})}" method="post">
                    <input type="hidden" name="back" th:value="${'/messages/' + other.userId}">
                    <button class="btn btn--primary" type="submit" th:text="#{community.follow}">Follow</button>
                </form>
                <p th:if="${following}" th:text="#{community.thread.wait_follow}">You follow this farmer. They need to follow you to enable chat.</p>
            </div>

            <p class="card__text" th:if="${canMessage and #lists.isEmpty(thread)}"
               th:text="#{community.thread.empty}">No messages yet - write the first one.</p>

              <div class="post" th:each="msg : ${thread}"
                  th:classappend="${msg.senderId == me} ? ' message--mine' : ' message--theirs'">
                <div class="post__meta">
                    <span th:if="${msg.senderId == me}" th:text="#{community.thread.you}">You</span>
                    <span th:if="${msg.senderId != me}" th:text="${other.displayName()}">Farmer</span>
                    <span th:text="${#temporals.format(msg.createdAt, 'dd MMM yyyy, HH:mm')}">18 Oct 2026</span>
                </div>
                <p class="card__text" th:text="${msg.content}">message</p>
            </div>

            <form th:if="${canMessage}" th:action="@{/messages/{id}(id=${other.userId})}" method="post"
                style="margin-top:12px;">
                <div class="form-row">
                    <label for="content" th:text="#{community.thread.type}">Your message</label>
                  <textarea id="content" name="content" maxlength="1000" required
                        th:classappend="${messageErrors['content'] != null} ? ' is-invalid'"
                        th:text="${messageValue}"></textarea>
                  <span class="form-error" th:if="${messageErrors['content'] != null}"
                      th:text="${messageErrors['content']}">error</span>
                </div>
                <button class="btn btn--primary" type="submit"
                        th:text="#{community.thread.send}">Send</button>
            </form>
        </div>
    </div>
    <!-- TILE END: commthread-body -->

</th:block>

</body>
</html>
